[package]
name = "hhead"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Hex head/dump utility with color, UTF-8 and Markdown/document rendering, image minimaps, directory trees, and a built-in pager"
authors = ["Martingalefan"]
license = "MIT"
readme = "Readme.md"
repository = "https://github.com/yfyang86/hhead"
keywords = ["hexdump", "hex", "cli", "markdown", "pager"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["wiki/", "assets/", ".gitignore"]

[lib]
name = "hhead"
path = "src/lib.rs"

[[bin]]
name = "hhead"
path = "src/main.rs"

[dependencies]
anydoc = "0.2.3"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
crossterm = "0.29.0"
image = "0.25"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.0"
